name: Native Linux release candidates
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container: debian:bookworm-slim@sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e
    defaults:
      run:
        shell: bash
    steps:
      - name: Install checkout prerequisites in minimal container
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash scripts/install_build_deps.sh
      - name: Build converter, test against it and freeze the application
        env:
          COUCHCHD_RUN_TESTS: '1'
          JOBS: '2'
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build_linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/release/${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  draft:
    # Manual dispatch on a branch only builds downloadable artifacts. A tag creates a
    # draft, never a public release; publishing remains an explicit maintainer decision.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Verify both architecture manifests before combining
        working-directory: assets
        run: |
          sha256sum --check SHA256SUMS-x86_64
          sha256sum --check SHA256SUMS-aarch64
          cat SHA256SUMS-x86_64 SHA256SUMS-aarch64 > SHA256SUMS
      - name: Attest release checksums on public GitHub
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: assets/SHA256SUMS
      - name: Stage assets for maintainer and hardware review
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$REPO" --verify-tag --draft --title "CouchCHD $TAG" --notes-file - ./* <<'NOTES'
          Builds: x86_64 AppImage and aarch64 Recalbox tarball (64-bit glibc 2.36+). See INSTALL.txt in each bundle. rclone is optional.

          Verify with `sha256sum --ignore-missing -c SHA256SUMS`. For public GitHub builds first run `gh attestation verify SHA256SUMS --repo OWNER/REPO` with the repository from this release URL. For chdman alone, extract its architecture-specific tarball and run `sha256sum -c SHA256SUMS` inside the extracted architecture directory.

          Corresponding source: CouchCHD, MAME, static SDL, Qt, PySide, pygame-ce, PyInstaller and the AppImage runtime archives accompany these binaries. See SOURCES-*.txt, including the exact Debian source package versions, and notices in each package.

          Maintainer publication gate: test launch, gamepad-only navigation, real conversion + verify + undo on a disposable library, suspend/resume and reboot persistence on actual Steam Deck/Bazzite and Pi 4/Recalbox. Record OS, architecture, controller and results here. Review notices and ensure equivalent source access for all redistributed libraries (including wheel codecs) remains available beside the binaries; mirror sources as necessary. CI passing is not hardware certification. Do not publish unsupported compatibility claims.
          NOTES
