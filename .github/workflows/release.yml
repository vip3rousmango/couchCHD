name: Native Linux release candidates
on:
  workflow_dispatch:
    inputs:
      target:
        description: Packages to qualify
        type: choice
        default: all
        options: [all, android]
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Android 12 emulator and build tools
        run: |
          # The AOSP image uses the standard SDK license already installed on hosted
          # runners. Receive needs no Play services or Google APIs preview image.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "emulator" "system-images;android-31;default;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod a+rw /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user" ANDROID_AVD_HOME="$RUNNER_TEMP/android-user/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n receiver -k 'system-images;android-31;default;x86_64'
          test -s "$ANDROID_AVD_HOME/receiver.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd receiver -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 </dev/null &
      - name: Build signed Android companion
        if: github.event_name == 'push'
        env:
          KEYSTORE: ${{ secrets.COUCHCHD_RECEIVE_KEYSTORE }}
          COUCHCHD_STORE_PASSWORD: ${{ secrets.COUCHCHD_RECEIVE_PASSWORD }}
        run: |
          umask 077
          export COUCHCHD_KEYSTORE="$RUNNER_TEMP/receiver.p12" COUCHCHD_KEY_ALIAS=receiver
          export COUCHCHD_KEY_PASSWORD="$COUCHCHD_STORE_PASSWORD"
          trap 'rm -f "$COUCHCHD_KEYSTORE"' EXIT
          printf %s "$KEYSTORE" | base64 --decode > "$COUCHCHD_KEYSTORE"
          unset KEYSTORE
          mkdir -p receiver-release
          bash android/build.sh "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" receiver-release/CouchCHD-Receive.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs receiver-release/CouchCHD-Receive.apk | grep -Fx 'Signer #1 certificate SHA-256 digest: 9ae07a8e885e055a8351eab33be0163d6b28c8aec851abc19f305b4b0cb4b3a1'
      - name: Build disposable manual-test companion
        if: github.event_name == 'workflow_dispatch'
        run: |
          export COUCHCHD_KEYSTORE="$RUNNER_TEMP/test.p12" COUCHCHD_KEY_ALIAS=test COUCHCHD_STORE_PASSWORD=disposable COUCHCHD_KEY_PASSWORD=disposable
          keytool -genkeypair -keystore "$COUCHCHD_KEYSTORE" -alias test -keyalg RSA -keysize 2048 -storepass disposable -keypass disposable -dname CN=Test
          mkdir -p receiver-release
          bash android/build.sh test "$GITHUB_RUN_NUMBER" receiver-release/CouchCHD-Receive.apk
      - name: Receive over TLS on Android 12
        run: |
          python3 -m venv "$RUNNER_TEMP/wifi"
          "$RUNNER_TEMP/wifi/bin/pip" install cryptography
          timeout 120 adb wait-for-device || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          timeout 300 bash -c 'until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done'
          adb shell wm size 640x480
          adb shell wm density 160
          adb shell input keyevent 82
          adb install receiver-release/CouchCHD-Receive.apk
          PYTHONPATH=src "$RUNNER_TEMP/wifi/bin/python" scripts/smoke_android_receive.py
          (cd receiver-release && sha256sum CouchCHD-Receive.apk > SHA256SUMS-android)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-android
          path: receiver-release/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-receive-screen
          path: ${{ runner.temp }}/receiver-*.png
          if-no-files-found: ignore
  package:
    if: github.event_name == 'push' || inputs.target != 'android'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container: debian:bookworm-slim@sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e
    defaults:
      run:
        shell: bash
    steps:
      - name: Install checkout prerequisites in minimal container
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash scripts/install_build_deps.sh
      - name: Build converter, test against it and freeze the application
        env:
          COUCHCHD_RUN_TESTS: '1'
          JOBS: '2'
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build_linux.sh
      - name: Exercise device setup with the built distribution
        run: |
          set -euo pipefail
          arch=$(uname -m)
          out="dist/release/$arch"
          export HOME=$(mktemp -d) XDG_DATA_HOME=$(mktemp -d)
          if [[ $arch == aarch64 ]]; then
            # This job runs in a disposable Debian container, not on a user's Pi.
            mkdir -p /recalbox/share/{system/.emulationstation,roms/ports}
            asset=CouchCHD-Recalbox-aarch64.tar.gz
            launcher=/recalbox/share/system/couchchd/run-couchchd
          else
            asset=CouchCHD-x86_64.AppImage
            launcher="$XDG_DATA_HOME/couchchd/run-couchchd"
            mkdir -p "$HOME/.local/share/Steam/userdata/123/config"
          fi
          test "$(sh scripts/install-device.sh --probe)" = "$arch"
          digest=$(awk -v f="$asset" '$2 == f {print $1}' "$out/SHA256SUMS-$arch")
          sh scripts/install-device.sh --receive "$arch" "$digest" < "$out/$asset"
          "$launcher" --version
          if [[ $arch == aarch64 ]]; then
            test -s /recalbox/share/system/.emulationstation/systemlist.xml
            test -f /recalbox/share/roms/ports/couchchd/CouchCHD.game
          else
            entry="$XDG_DATA_HOME/applications/io.github.vip3rousmango.CouchCHD.desktop"
            desktop-file-validate "$entry"
            # Parse via GLib's desktop-entry implementation, not by grepping
            # Icon=. The icon must resolve without any themed icon cache.
            /usr/bin/python3 - "$entry" <<'PY'
          from gi.repository import Gio
          from pathlib import Path
          import os, sys
          app = Gio.DesktopAppInfo.new_from_filename(sys.argv[1])
          icon = app.get_icon()
          assert isinstance(icon, Gio.FileIcon), icon
          png = Path(icon.get_file().get_path())
          assert png.is_absolute() and png.is_relative_to(os.environ['XDG_DATA_HOME']), png
          from gi.repository import GdkPixbuf
          cover = GdkPixbuf.Pixbuf.new_from_file_at_scale(str(png), 32, 32, True)
          assert cover.get_width() == 32 and cover.get_height() == 32 and any(cover.get_pixels())
          PY
            xvfb-run -a -s '-screen 0 1280x800x24 -extension GLX' bash -eu -c '
              gio launch "$1"
              timeout 60 xdotool search --sync --onlyvisible --name "^CouchCHD"
            ' _ "$entry"
            python3 -m venv "$HOME/reader"
            grep '^vdf==' packaging/requirements-linux.txt > "$HOME/vdf.txt"
            "$HOME/reader/bin/pip" install --require-hashes --no-deps -r "$HOME/vdf.txt"
            xvfb-run -a -s '-screen 0 1280x800x24 -extension GLX' \
              "$HOME/reader/bin/python" scripts/smoke_steam_shortcut.py "$launcher"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/release/${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  recalbox-storage:
    needs: package
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-aarch64
          path: release
      - name: Install and relaunch the ARM bundle with a noexec SHARE
        run: |
          set -euo pipefail
          # A disposable loop disk gives this test real mount flags without
          # requiring a Pi or changing the runner's existing mount policy.
          sudo mkdir -p /recalbox/share /media/couchchd-test
          sudo mount -t tmpfs -o noexec tmpfs /recalbox/share
          truncate -s 2G "$RUNNER_TEMP/data.ext4"
          mkfs.ext4 -q "$RUNNER_TEMP/data.ext4"
          sudo mount -o loop "$RUNNER_TEMP/data.ext4" /media/couchchd-test
          sudo mkdir -p /recalbox/share/{system/.emulationstation,roms/ports}
          asset=CouchCHD-Recalbox-aarch64.tar.gz
          digest=$(awk -v f="$asset" '$2 == f {print $1}' release/SHA256SUMS-aarch64)
          sudo sh scripts/install-device.sh --receive aarch64 "$digest" < "release/$asset"
          launcher=/media/couchchd-test/couchchd/run-couchchd
          sudo "$launcher" --version
          sudo grep -F "$launcher" /recalbox/share/system/.emulationstation/systemlist.xml
          sudo test -f /recalbox/share/roms/ports/couchchd/CouchCHD.game
      - name: Install on a single exFAT card and convert with the installed ARM launcher
        run: |
          set -euo pipefail
          sudo umount /media/couchchd-test /recalbox/share
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends exfatprogs
          sudo modprobe loop
          sudo modprobe squashfs
          # Exercise the production 2 GiB library reserve; never lower it for CI.
          truncate -s 4G "$RUNNER_TEMP/share.exfat"
          mkfs.exfat "$RUNNER_TEMP/share.exfat"
          sudo mount -t exfat -o loop,rw,fmask=0133,dmask=0022 "$RUNNER_TEMP/share.exfat" /recalbox/share
          sudo mkdir -p /recalbox/share/{system/.emulationstation,roms/ports}
          asset=CouchCHD-Recalbox-aarch64.squashfs
          digest=$(awk -v f="$asset" '$2 == f {print $1}' release/SHA256SUMS-aarch64)
          test "${#digest}" = 64
          sudo sh scripts/install-device.sh --receive aarch64 "$digest" < "release/$asset"
          launcher=/recalbox/share/system/couchchd/run-couchchd
          sudo test ! -x "$launcher"
          sudo sh "$launcher" --version
          # Reattach only the card. No prior runtime mount or external disk
          # should be needed to launch the installed build again.
          sudo umount /recalbox/share
          sudo mount -t exfat -o loop,rw,fmask=0133,dmask=0022 "$RUNNER_TEMP/share.exfat" /recalbox/share
          sudo test -f /recalbox/share/roms/ports/couchchd/CouchCHD.game
          sudo grep -F "$launcher" /recalbox/share/system/.emulationstation/systemlist.xml
          sudo mkdir -p /recalbox/share/roms/psx
          sudo dd if=/dev/zero of=/recalbox/share/roms/psx/test.bin bs=2352 count=300 status=none
          printf 'FILE "test.bin" BINARY\n  TRACK 01 AUDIO\n    INDEX 01 00:00:00\n' | sudo tee /recalbox/share/roms/psx/test.cue >/dev/null
          sudo touch -d '1 minute ago' /recalbox/share/roms/psx/test.{bin,cue}
          sudo sh "$launcher" --headless --root /recalbox/share/roms --auto --system psx --keep-originals --preset silent
          sudo test -s /recalbox/share/roms/psx/test.chd
          sudo test -s /recalbox/share/roms/psx/test.bin
  release:
    # Manual dispatch builds artifacts only. Public previews and normal tag drafts
    # both require all native build, conversion, Qt and installer gates to pass.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, recalbox-storage, receiver]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Verify native and receiver manifests before combining
        working-directory: assets
        run: |
          sha256sum --check SHA256SUMS-x86_64
          sha256sum --check SHA256SUMS-aarch64
          sha256sum --check SHA256SUMS-android
          cat SHA256SUMS-x86_64 SHA256SUMS-aarch64 SHA256SUMS-android > SHA256SUMS
      - name: Attest release checksums on public GitHub
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: assets/SHA256SUMS
      - name: Publish TEST prerelease or create maintainer draft
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            title="TEST prerelease: CouchCHD $TAG"
            visibility=(--prerelease --latest=false)
          else
            title="CouchCHD $TAG"
            visibility=(--draft)
          fi
          gh release create "$TAG" --repo "$REPO" --verify-tag "${visibility[@]}" --title "$title" --notes-file - ./* <<'NOTES'
          Hardware testing build, not device certification. Back up your library and test with disposable copies first.

          Format support includes CHD, PSP CSO, Dolphin RVZ, original Xbox XISO, CARD1 3DS trimming, and single-ROM 7z for supported cartridge cores. XISO and trimmed 3DS always retain the original. Test emulator playback and existing saves before clearing any recoverable originals.

          New in preview.19: saving a home library scans nested platform folders and distinguishes ready games from originals. Refresh an older saved library once. Use Dashboard → Sync to handheld to send from a saved mounted library with the default RG405M profile. The host and Android companion show the device, pairing state, file progress and network speed. Wait for Transfer complete, then Sync in Daijishō.

          New library workflows: preview a space goal, check library health without editing ROMs, mark verified outputs after playing and reclaim only reviewed backups. Export complete RG405M playlists or pull an existing compressed game from a named mounted/rclone library without recompression or overwriting conflicting games. Mixed loose-disc and supported ZIP libraries process one archive at a time; PSP ZIP-to-CSO streams without writing an intermediate ISO. Original ZIPs are always retained.

          ANBERNIC companion export profiles filter formats by firmware and confirmed player/core. Choose the card or game folder explicitly before copying. Android and older Linux devices need not run CouchCHD to receive games. Device and firmware research, caveats and a physical testing checklist are linked from the README. The optional --device-report installer mode does not install or send data.

          Native Linux x86_64 AppImage, aarch64 tarball and aarch64 SquashFS (single-card Recalbox), built on Debian 12; 64-bit glibc 2.36+ userspace required. Qt also needs a working graphics/input stack; ARM devices without a desktop display need compatible EGL/KMS drivers. AArch64 architecture alone does not establish Pi, Android, distro or frontend compatibility. See INSTALL.txt in the bundles. rclone is optional.

          Verify downloaded files using the attached SHA256SUMS (`sha256sum --ignore-missing -c SHA256SUMS`). On public GitHub, verify the checksum manifest's provenance with `gh attestation verify SHA256SUMS --repo vip3rousmango/couchCHD`. For chdman alone, extract the architecture-specific tarball and run `sha256sum -c SHA256SUMS` inside its architecture directory.

          Corresponding source: CouchCHD, MAME, DolphinTool and its bundled dependencies, static SDL, Qt, PySide, pygame-ce, PyInstaller and the AppImage runtime sources accompany these binaries. See SOURCES-*.txt, the per-architecture Dolphin source archives, and notices in each package.

          Before a stable release: test launch from the device menu, gamepad-only navigation, conversion + verify + undo, suspend/resume and reboot persistence on actual target devices. Record OS/version, architecture, graphics stack, controller and results. Review notices and ensure continued access to the corresponding sources for redistributed libraries and wheel codecs.
          NOTES
