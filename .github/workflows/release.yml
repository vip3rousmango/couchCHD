name: Native Linux release candidates
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container: debian:bookworm-slim@sha256:e67eeead736ff7bbe258ef088bff683635c561b1fcfefad0806c1df4ab49ce0e
    defaults:
      run:
        shell: bash
    steps:
      - name: Install checkout prerequisites in minimal container
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash scripts/install_build_deps.sh
      - name: Build converter, test against it and freeze the application
        env:
          COUCHCHD_RUN_TESTS: '1'
          JOBS: '2'
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build_linux.sh
      - name: Exercise device setup with the built distribution
        run: |
          set -euo pipefail
          arch=$(uname -m)
          out="dist/release/$arch"
          export HOME=$(mktemp -d) XDG_DATA_HOME=$(mktemp -d)
          if [[ $arch == aarch64 ]]; then
            # This job runs in a disposable Debian container, not on a user's Pi.
            mkdir -p /recalbox/share/{system/.emulationstation,roms/ports}
            asset=CouchCHD-Recalbox-aarch64.tar.gz
            launcher=/recalbox/share/system/couchchd/run-couchchd
          else
            asset=CouchCHD-x86_64.AppImage
            launcher="$XDG_DATA_HOME/couchchd/run-couchchd"
          fi
          test "$(sh scripts/install-device.sh --probe)" = "$arch"
          digest=$(awk -v f="$asset" '$2 == f {print $1}' "$out/SHA256SUMS-$arch")
          sh scripts/install-device.sh --receive "$arch" "$digest" < "$out/$asset"
          "$launcher" --version
          if [[ $arch == aarch64 ]]; then
            test -s /recalbox/share/system/.emulationstation/systemlist.xml
            test -f /recalbox/share/roms/ports/couchchd/CouchCHD.game
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/release/${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  release:
    # Manual dispatch builds artifacts only. Public previews and normal tag drafts
    # both require all native build, conversion, Qt and installer gates to pass.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Verify both architecture manifests before combining
        working-directory: assets
        run: |
          sha256sum --check SHA256SUMS-x86_64
          sha256sum --check SHA256SUMS-aarch64
          cat SHA256SUMS-x86_64 SHA256SUMS-aarch64 > SHA256SUMS
      - name: Attest release checksums on public GitHub
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: assets/SHA256SUMS
      - name: Publish TEST prerelease or create maintainer draft
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            title="TEST prerelease: CouchCHD $TAG"
            visibility=(--prerelease --latest=false)
          else
            title="CouchCHD $TAG"
            visibility=(--draft)
          fi
          gh release create "$TAG" --repo "$REPO" --verify-tag "${visibility[@]}" --title "$title" --notes-file - ./* <<'NOTES'
          Hardware testing build, not device certification. Back up your library and test with disposable copies first.

          Native Linux x86_64 AppImage and aarch64 tarball, built on Debian 12; 64-bit glibc 2.36+ userspace required. The ARM asset retains its original Recalbox filename. Qt also requires a working graphics/input stack; ARM devices without a desktop display need compatible EGL/KMS drivers. AArch64 architecture alone does not establish Pi, distro or frontend compatibility. See INSTALL.txt in the bundles. rclone is optional.

          Verify downloaded files using the attached SHA256SUMS (`sha256sum --ignore-missing -c SHA256SUMS`). On public GitHub, verify the checksum manifest's provenance with `gh attestation verify SHA256SUMS --repo vip3rousmango/couchCHD`. For chdman alone, extract the architecture-specific tarball and run `sha256sum -c SHA256SUMS` inside its architecture directory.

          Corresponding source: CouchCHD, MAME, static SDL, Qt, PySide, pygame-ce, PyInstaller and the AppImage runtime archives accompany these binaries. See SOURCES-*.txt, including the exact Debian source package versions, and notices in each package.

          Before a stable release: test launch from the device menu, gamepad-only navigation, conversion + verify + undo, suspend/resume and reboot persistence on actual target devices. Record OS/version, architecture, graphics stack, controller and results. Review notices and ensure continued access to the corresponding sources for redistributed libraries and wheel codecs.
          NOTES
